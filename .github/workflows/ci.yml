name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The render integration tests (spec 08 task 9) need ffmpeg, Chrome and the motion runtime,
      # and fail on CI when any is missing. Chrome's sandbox needs user namespaces on Ubuntu 24.04.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motionpop/motion exec node scripts/build-runtime.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  motion:
    # motion:check per scene/component: stills in 3 formats, layout, contrast, composition.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: [big-number, stat-punch, hook-statement, versus]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm motion:check ${{ matrix.id }}

  e2e:
    # Playwright: the editor in local mode and the auth flow on the emulators (needs Java).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motionpop/web exec playwright install --with-deps chromium
      - run: pnpm --filter @motionpop/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: apps/web/e2e-output/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rules:
    # Firestore + Storage security rules on the emulator (offline demo project, no credentials).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motionpop/web test:rules
