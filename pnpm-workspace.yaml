packages:
  - apps/*
  - packages/*
  - services/*

# Dependencies allowed to run install scripts (pnpm 11 rejects unreviewed builds).
allowBuilds:
  esbuild: true
  # Browser-only Whisper: the Node ONNX runtime binary and protobufjs postinstall are not needed.
  onnxruntime-node: false
  protobufjs: false
  # Writes App Hosting auto-init defaults; we pass the config explicitly from env.
  '@firebase/util': false
  # puppeteer downloads the headless Chrome that @hyperframes/producer renders with.
  puppeteer: true
  sharp: true
  unrs-resolver: true

# Shared versions. Reference with "catalog:" in package.json.
catalog:
  # HyperFrames is pre-1.0: keep every @hyperframes/* package on the same exact version.
  '@hyperframes/core': 0.9.46
  '@hyperframes/player': 0.9.46
  '@hyperframes/producer': 0.9.46
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.2.3
  fast-check: ^4.10.2
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: 6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7
