# Firebase App Hosting (spec 01 R7). Cost: scale to zero, at most 2 instances.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  # The Firebase web config comes from FIREBASE_WEBAPP_CONFIG (injected by App Hosting) and is
  # mapped to NEXT_PUBLIC_* in next.config.ts. The reCAPTCHA Enterprise site key is public.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdPeSAuAAAAABLJLe7lbgK25EZIzeN4zGOmipqq
    availability:
      - BUILD
      - RUNTIME
  # Verified emails that get the judge plan on first sign-in (spec 13). A secret: it lists people.
  - variable: JUDGE_EMAILS
    secret: JUDGE_EMAILS
    availability:
      - RUNTIME
  # The export render job (spec 08 design §17). Not secrets.
  - variable: RENDER_JOB
    value: motionpop-render
    availability:
      - RUNTIME
  - variable: RENDER_REGION
    value: us-central1
    availability:
      - RUNTIME
  # Billing mode defaults to test_mode until Dodo Payments live secrets are created in Secret Manager
  # (spec 44). Before uncommenting any `secret:` entries below, create each secret in GCP Secret Manager
  # and grant the App Hosting backend access (`firebase apphosting:secrets:grantaccess <NAME>`):
  #   - PIXABAY_API_KEY
  #   - PEXELS_API_KEY
  #   - UNCOMMON_EAR_API_KEY
  #   - DODO_PAYMENTS_API_KEY
  #   - DODO_PAYMENTS_WEBHOOK_KEY
  #   - DODO_PRODUCT_STARTER_ID
  #   - DODO_PRODUCT_CREATOR_ID
  #   - DODO_PRODUCT_STUDIO_ID
  - variable: DODO_PAYMENTS_ENVIRONMENT
    value: test_mode
    availability:
      - RUNTIME
